server:
  port: 8080

spring:
  application:
    name: cv-management-system
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/externals-management
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  profiles:
    active: local

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  version: 1.0
  servers:
    - url: http://localhost:8080
      description: Development server
  info:
    title: Candidate Management API
    description: This API exposes endpoints to manage candidates
    version: 1.0
    contact:
      name: NTT Data
      email: contact@nttdata.ma
      url: https://www.nttdata.com

logging:
  level:
    root: INFO
    ma.nttdata.externals: DEBUG
    org.springframework.web: INFO
    org.hibernate: ERROR